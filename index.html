<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<title>Posto Marajó · Entrar</title>
<style>
:root{--bg:#e9e5e2;--card:#fff;--ink:#2a1517;--muted:#6f5b5e;--line:#d9d0ce;--red:#d9241f;--red-d:#a8191a;--errbg:#ffe3e1;--err:#8c1410;--okbg:#e1f6ea;--ok:#1f7a45;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150c0e;--card:#251619;--ink:#f5eaea;--muted:#b99da0;--line:#47303a;--errbg:#4a1b1c;--err:#ffb3ae;--okbg:#17321f;--ok:#7fd9a1}}
:root[data-theme="dark"]{--bg:#150c0e;--card:#251619;--ink:#f5eaea;--muted:#b99da0;--line:#47303a;--errbg:#4a1b1c;--err:#ffb3ae;--okbg:#17321f;--ok:#7fd9a1}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow-y:auto;line-height:1.45}
.shell{width:min(940px,100%);min-height:540px;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(40,10,15,.22)}
.brand{background:linear-gradient(160deg,#c2201f 0%,#8f1620 60%,#6d0f1a 100%);color:#fff;padding:44px 40px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.brand::after{content:"";position:absolute;right:-90px;bottom:-90px;width:300px;height:300px;border:46px solid rgba(255,255,255,.07);border-radius:50%}
.badge{width:104px;height:104px;border-radius:50%;background:#f4f2ef;display:grid;place-items:center;box-shadow:0 8px 24px rgba(40,0,10,.35)}
.badge img{width:78px;height:78px;display:block}
.brand h2{font-size:2rem;line-height:1.1;margin:28px 0 10px;font-weight:600}
.brand p{margin:0;max-width:30ch;opacity:.88}
.brand small{opacity:.7;font-size:.82rem;position:relative;z-index:1}
.card{padding:52px 48px;display:flex;flex-direction:column;justify-content:center}
h1{font-size:1.5rem;font-weight:600;margin:0 0 6px}
.sub{color:var(--muted);font-size:.92rem;margin:0 0 26px}
.fl{display:block;font-size:.86rem;font-weight:500;margin:0 0 6px}
.field{position:relative;margin-bottom:16px}
.field svg.ic{position:absolute;left:0;top:0;width:44px;height:100%;padding:14px;color:#9b8b8d;pointer-events:none}
.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:6px;padding:0 46px 0 44px;font:inherit;font-size:.95rem;color:var(--ink);background:var(--card)}
.field input::placeholder{color:#a8999b}
.field input:focus-visible{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(217,36,31,.18)}
.field.bad input{border-color:var(--red)}
.eye{position:absolute;right:0;top:0;width:46px;height:46px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.eye:focus-visible{outline:2px solid var(--red);outline-offset:-4px;border-radius:6px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:.86rem;margin:2px 0 20px;gap:8px}
.row label{display:flex;align-items:center;gap:8px;cursor:pointer}
.row input{accent-color:var(--red-d);width:16px;height:16px}
.link{background:none;border:0;color:var(--red-d);font:inherit;font-weight:500;cursor:pointer;padding:2px}
.link:hover{text-decoration:underline}
.link:focus-visible,.btn:focus-visible,.row input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.btn{width:100%;height:48px;border:0;border-radius:6px;background:var(--red-d);color:#fff;font:inherit;font-weight:600;font-size:1rem;cursor:pointer;transition:background .15s}
.btn:hover:not(:disabled){background:#8d1416}
.btn:disabled{opacity:.65;cursor:not-allowed}
.msg{font-size:.86rem;margin:0 0 12px;padding:0}
.msg.err{background:var(--errbg);color:var(--err);border-radius:6px;padding:10px 12px}
.msg.ok{background:var(--okbg);color:var(--ok);border-radius:6px;padding:10px 12px}
.back{display:block;margin:16px auto 0}
.hide{display:none!important}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:8px;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
@media (max-width:760px){.shell{grid-template-columns:1fr;min-height:0}.brand{padding:26px 24px;flex-direction:row;align-items:center;gap:16px;justify-content:flex-start}.brand::after,.brand p,.brand small{display:none}.badge{width:68px;height:68px;flex:none}.badge img{width:52px;height:52px}.brand h2{margin:0;font-size:1.4rem}.card{padding:32px 24px}}
#app{display:none}
body.in{overflow:hidden}
body.in .shell{display:none}
body.in #app{display:block;position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f2ef}
</style>
</head>

<\/div>\n  <\/section>\n<\/div>\n<\/main><\/div>\n\n<dialog id=\"dlg\">\n  <h2 id=\"dlgT\">Exportar CSV<\/h2>\n  <p id=\"dlgP\" style=\"font-size:.88rem;color:var(--muted);margin:0 0 10px\">Copie o texto e cole numa planilha. Os campos são separados por ponto e vírgula.<\/p>\n  <textarea id=\"csv\" readonly aria-label=\"Conteúdo CSV\"><\/textarea>\n  <div class=\"actions\"><button class=\"btn\" id=\"copy\" type=\"button\">Copiar<\/button><button class=\"btn sec\" id=\"close\" type=\"button\">Fechar<\/button><\/div>\n<\/dialog>\n\n<script>\n(function(){\n  var UK=\"__UKEY__\",OLD1=\"marajo_caixa_v1\",KEY=OLD1+\"_\"+UK,DOCS=[\"Cupom fiscal\",\"Comprovante de cartão\",\"Nota de abastecimento\",\"Comprovante de sangria\",\"Vale / fiado\",\"Cheque\"];\n  var $=function(i){return document.getElementById(i)};\n  var recs=[],editId=null,armed=null;\n  var brl=new Intl.NumberFormat(\"pt-BR\",{style:\"currency\",currency:\"BRL\"});\n  function load(){try{var v=localStorage.getItem(KEY);if(v===null){var o=localStorage.getItem(OLD1);if(o!==null){v=o;localStorage.setItem(KEY,o);localStorage.removeItem(OLD1)}}recs=JSON.parse(v||\"[]\")||[]}catch(e){recs=[]}}\n  function persist(){dirty.recs=true;cloudSave(\"recs\",recs);try{localStorage.setItem(KEY,JSON.stringify(recs));return true}catch(e){return false}}\n  function esc(s){return String(s).replace(/[&<>\"']/g,function(c){return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]})}\n  function today(){var d=new Date(),p=function(n){return String(n).padStart(2,\"0\")};return d.getFullYear()+\"-\"+p(d.getMonth()+1)+\"-\"+p(d.getDate())}\n  function fdate(s){var a=s.split(\"-\");return a[2]+\"/\"+a[1]+\"/\"+a[0]}\n  function parseMoney(t){\n    t=t.replace(/[R$\\s]/g,\"\");if(!t)return NaN;\n    if(t.indexOf(\",\")>-1)t=t.replace(/\\./g,\"\").replace(\",\",\".\");\n    else if(/^\\d{1,3}(\\.\\d{3})+$/.test(t))t=t.replace(/\\./g,\"\");\n    var n=Number(t);return isFinite(n)&&n>=0?Math.round(n*100):NaN;\n  }\n  function say(t,k){var m=$(\"msg\");m.textContent=t;m.className=\"msg\"+(t?\" \"+k:\"\")}\n  function flag(id,on){$(id).classList.toggle(\"bad\",on)}\n\n  // chips\n  $(\"chips\").innerHTML=DOCS.map(function(d,i){return '<label><input type=\"checkbox\" value=\"'+esc(d)+'\"> '+esc(d)+'<\/label>'}).join(\"\");\n  function missing(){return document.querySelector('input[name=miss]:checked').value===\"y\"}\n  document.querySelectorAll(\"input[name=miss]\").forEach(function(r){r.addEventListener(\"change\",function(){$(\"missBox\").classList.toggle(\"hide\",!missing());say(\"\")})});\n  [\"op\",\"dt\",\"val\",\"short\",\"note\"].forEach(function(i){$(i).addEventListener(\"input\",function(){flag(i,false);say(\"\")})});\n\n  function resetForm(){\n    editId=null;$(\"f\").reset();$(\"dt\").value=today();$(\"missBox\").classList.add(\"hide\");\n    $(\"ft\").textContent=\"Novo lançamento\";$(\"save\").textContent=\"Salvar lançamento\";$(\"cancel\").classList.add(\"hide\");\n    [\"op\",\"dt\",\"val\",\"short\",\"note\"].forEach(function(i){flag(i,false)});\n  }\n\n  $(\"f\").addEventListener(\"submit\",function(e){\n    e.preventDefault();\n    var op=$(\"op\").value.trim(),dt=$(\"dt\").value,cents=parseMoney($(\"val\").value.trim()),miss=missing();\n    var shv=$(\"short\").value.trim(),shortC=shv?parseMoney(shv):0;\n    var docs=[].slice.call(document.querySelectorAll(\"#chips input:checked\")).map(function(c){return c.value});\n    var note=$(\"note\").value.trim();\n    [\"op\",\"dt\",\"val\",\"short\",\"note\"].forEach(function(i){flag(i,false)});\n    if(!op){flag(\"op\",true);say(\"Informe o nome do operador.\",\"err\");$(\"op\").focus();return}\n    if(!dt){flag(\"dt\",true);say(\"Informe a data do caixa.\",\"err\");$(\"dt\").focus();return}\n    if(isNaN(cents)){flag(\"val\",true);say(\"Digite o valor do caixa, por exemplo 1.250,90.\",\"err\");$(\"val\").focus();return}\n    if(isNaN(shortC)){flag(\"short\",true);say(\"Valor faltando inválido. Use, por exemplo, 35,50 ou deixe vazio.\",\"err\");$(\"short\").focus();return}\n    if(miss&&!docs.length&&!note){flag(\"note\",true);say(\"Marque os documentos que faltaram ou descreva a falta.\",\"err\");$(\"note\").focus();return}\n    var r={id:editId||String(Date.now())+Math.random().toString(36).slice(2,6),operator:op,date:dt,cents:cents,short:shortC,missing:miss,docs:miss?docs:[],note:miss?note:\"\"};\n    var wasEdit=!!editId;\n    if(wasEdit)recs=recs.map(function(x){return x.id===editId?r:x});else recs.push(r);\n    var ok=persist();resetForm();render();\n    say(ok?(wasEdit?\"Lançamento atualizado.\":\"Lançamento salvo.\"):\"Salvo só nesta tela: o navegador bloqueou o armazenamento.\",ok?\"ok\":\"err\");\n    $(\"op\").focus();\n  });\n  $(\"cancel\").addEventListener(\"click\",function(){resetForm();say(\"\")});\n\n  function edit(id){\n    var r=recs.filter(function(x){return x.id===id})[0];if(!r)return;\n    editId=id;$(\"op\").value=r.operator;$(\"dt\").value=r.date;$(\"val\").value=(r.cents/100).toFixed(2).replace(\".\",\",\");$(\"short\").value=r.short?(r.short/100).toFixed(2).replace(\".\",\",\"):\"\";\n    document.querySelector('input[name=miss][value='+(r.missing?\"y\":\"n\")+']').checked=true;\n    $(\"missBox\").classList.toggle(\"hide\",!r.missing);\n    document.querySelectorAll(\"#chips input\").forEach(function(c){c.checked=r.docs.indexOf(c.value)>-1});\n    $(\"note\").value=r.note;$(\"ft\").textContent=\"Editar lançamento\";$(\"save\").textContent=\"Salvar alterações\";$(\"cancel\").classList.remove(\"hide\");\n    say(\"\");$(\"f\").scrollIntoView({behavior:\"smooth\",block:\"start\"});$(\"op\").focus();\n  }\n\n  function filtered(){\n    var q=$(\"q\").value.trim().toLowerCase(),mo=$(\"mo\").value,om=$(\"onlyMiss\").checked;\n    return recs.filter(function(r){\n      return (!q||r.operator.toLowerCase().indexOf(q)>-1)&&(!mo||r.date.slice(0,7)===mo)&&(!om||r.missing);\n    }).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id.locale   $("fForgot").addEventListener("submit",function(e){
    e.preventDefault();var v=$("femail").value.trim(),m=$("fmsg");
    if(!v){bad("fFEmail",true);say(m,"Digite seu usuário ou e-mail.","err");return}
    // Resposta igual para qualquer e-mail, para não revelar quais contas existem.
    say(m,"Se "+v+" tiver cadastro, as instruções chegam em alguns minutos.","ok");
  });

  // Restaura e-mail lembrado e sessão ativa
  var saved=read("marajo_email");
  if(saved){$("email").value=saved;$("remember").checked=true}
  try{var s=JSON.parse(sread("marajo_user")||"null");if(s)welcome(s)}catch(e){}
})();
</script>
</body>
