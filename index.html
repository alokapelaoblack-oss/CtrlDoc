<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Posto Marajó · Entrar</title>
<style>
:root{--red:#d9241f;--red-d:#a8191a;--ink:#2a1517;--muted:#7a5d60;--glass:rgba(255,255,255,.28);--ok:#1f7a45;--err:#ffe3e1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#fff;background:#6b1d2b;
background-image:radial-gradient(60% 50% at 15% 20%,#b4232c 0,transparent 70%),radial-gradient(55% 55% at 85% 15%,#e0352f 0,transparent 70%),radial-gradient(60% 60% at 80% 90%,#c97a3a 0,transparent 70%),radial-gradient(60% 60% at 10% 90%,#4a2a6e 0,transparent 70%);
display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow-y:auto}
main{width:100%;max-width:380px;position:relative;margin-top:44px}
.badge{position:absolute;left:50%;top:-44px;transform:translateX(-50%);width:92px;height:92px;border-radius:50%;background:#f4f2ef;display:grid;place-items:center;box-shadow:0 6px 20px rgba(60,0,10,.35);z-index:1}
.badge img{width:68px;height:68px;display:block}
.card{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:62px 28px 26px;box-shadow:0 20px 50px rgba(50,0,15,.4)}
h1{font-size:1.2rem;font-weight:600;text-align:center;margin:0 0 4px}
.sub{text-align:center;font-size:.85rem;opacity:.85;margin:0 0 20px}
.field{position:relative;margin-bottom:12px}
.field svg.ic{position:absolute;left:0;top:0;width:42px;height:100%;padding:13px;background:#d9d3d4;color:#3b2a2c;border-radius:3px 0 0 3px}
.field input{width:100%;height:42px;border:2px solid transparent;border-radius:3px;padding:0 44px 0 52px;font:inherit;font-size:.95rem;color:var(--ink);background:#fff}
.field input::placeholder{color:#9b8b8d}
.field input:focus-visible{outline:none;border-color:#ffd2cf;box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.field.bad input{border-color:#ff5a52}
.eye{position:absolute;right:0;top:0;width:42px;height:42px;border:0;background:none;color:#6a5558;cursor:pointer;display:grid;place-items:center}
.eye:focus-visible{outline:2px solid var(--red);outline-offset:-4px;border-radius:3px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;margin:4px 0 18px;gap:8px}
.row label{display:flex;align-items:center;gap:7px;cursor:pointer}
.row input{accent-color:var(--red-d);width:15px;height:15px}
.link{background:none;border:0;color:#fff;font:inherit;text-decoration:underline;cursor:pointer;padding:2px}
.link:focus-visible,.btn:focus-visible,.row input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn{width:100%;height:46px;border:0;border-radius:2px;background:var(--red-d);color:#fff;font:inherit;font-weight:600;font-size:1rem;cursor:pointer;box-shadow:0 4px 0 #7d1114}
.btn:hover:not(:disabled){background:#bb1f21}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #7d1114}
.btn:disabled{opacity:.65;cursor:not-allowed}
.msg{min-height:20px;font-size:.84rem;margin:0 0 10px;padding:0;text-align:center}
.msg.err{background:var(--err);color:#8c1410;border-radius:3px;padding:8px 10px}
.msg.ok{background:#e1f6ea;color:var(--ok);border-radius:3px;padding:8px 10px}
.hint{margin:16px 0 0;text-align:center;font-size:.76rem;opacity:.8}
.back{display:block;margin:14px auto 0}
.hide{display:none!important}
#app{display:none}
body.in{overflow:hidden}
body.in main{display:none}
body.in #app{display:block;position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f2ef}
.welcome{text-align:center}
.welcome h1{font-size:1.35rem;margin-bottom:6px}
.welcome p{margin:0 0 22px;opacity:.9}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;vertical-align:-2px;margin-right:8px;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
</style>
</head>

an><\/label>\n      <\/div>\n\n      <div id=\"missBox\" class=\"hide\">\n        <label class=\"l\">Quais documentos faltaram?<\/label>\n        <div class=\"chips\" id=\"chips\"><\/div>\n        <label class=\"l\" for=\"note\">Detalhes da falta<\/label>\n        <textarea id=\"note\" placeholder=\"Ex.: falta o cupom do abastecimento das 14h, bomba 3\"><\/textarea>\n      <\/div>\n\n      <p class=\"msg\" id=\"msg\" role=\"alert\" aria-live=\"assertive\"><\/p>\n      <div class=\"actions\">\n        <button class=\"btn\" id=\"save\" type=\"submit\">Salvar lançamento<\/button>\n        <button class=\"btn sec hide\" id=\"cancel\" type=\"button\">Cancelar<\/button>\n      <\/div>\n    <\/form>\n  <\/section>\n\n  <section aria-labelledby=\"lt\">\n    <div class=\"stats\">\n      <div class=\"stat\"><b id=\"sCount\">0<\/b><span>lançamentos<\/span><\/div>\n      <div class=\"stat\"><b id=\"sSum\">R$ 0,00<\/b><span>total dos caixas<\/span><\/div>\n      <div class=\"stat warn\"><b id=\"sMiss\">0<\/b><span>com documento faltando<\/span><\/div>\n    <\/div>\n    <div class=\"top\">\n      <h2 id=\"lt\">Lançamentos<\/h2>\n      <button class=\"btn sec\" id=\"exp\" type=\"button\">Exportar CSV<\/button>\n    <\/div>\n    <div class=\"filters\">\n      <div><label class=\"l\" for=\"q\">Operador<\/label><input id=\"q\" type=\"text\" placeholder=\"Buscar pelo nome\"><\/div>\n      <div><label class=\"l\" for=\"mo\">Mês<\/label><input id=\"mo\" type=\"month\"><\/div>\n      <label class=\"chk\"><input id=\"onlyMiss\" type=\"checkbox\"> Só com falta<\/label>\n    <\/div>\n    <div class=\"tw\">\n      <table>\n        <thead><tr><th>Data<\/th><th>Operador<\/th><th class=\"v\">Total do caixa<\/th><th>Documentos<\/th><th><\/th><\/tr><\/thead>\n        <tbody id=\"rows\"><\/tbody>\n      <\/table>\n      <div class=\"empty hide\" id=\"empty\"><\/div>\n    <\/div>\n  <\/section>\n<\/div>\n\n<dialog id=\"dlg\">\n  <h2>Exportar CSV<\/h2>\n  <p style=\"font-size:.88rem;color:var(--muted);margin:0 0 10px\">Copie o texto e cole numa planilha. Os campos são separados por ponto e vírgula.<\/p>\n  <textarea id=\"csv\" readonly aria-label=\"Conteúdo CSV\"><\/textarea>\n  <div class=\"actions\"><button class=\"btn\" id=\"copy\" type=\"button\">Copiar<\/button><button class=\"btn sec\" id=\"close\" type=\"button\">Fechar<\/button><\/div>\n<\/dialog>\n\n<script>\n(function(){\n  var KEY=\"marajo_caixa_v1\",DOCS=[\"Cupom fiscal\",\"Comprovante de cartão\",\"Nota de abastecimento\",\"Comprovante de sangria\",\"Vale / fiado\",\"Cheque\"];\n  var $=function(i){return document.getElementById(i)};\n  var recs=[],editId=null,armed=null;\n  var brl=new Intl.NumberFormat(\"pt-BR\",{style:\"currency\",currency:\"BRL\"});\n  function load(){try{recs=JSON.parse(localStorage.getItem(KEY)||\"[]\")||[]}catch(e){recs=[]}}\n  function persist(){try{localStorage.setItem(KEY,JSON.stringify(recs));return true}catch(e){return false}}\n  function esc(s){return String(s).replace(/[&<>\"']/g,function(c){return {\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]})}\n  function today(){var d=new Date(),p=function(n){return String(n).padStart(2,\"0\")};return d.getFullYear()+\"-\"+p(d.getMonth()+1)+\"-\"+p(d.getDate())}\n  function fdate(s){var a=s.split(\"-\");return a[2]+\"/\"+a[1]+\"/\"+a[0]}\n  function parseMoney(t){\n    t=t.replace(/[R$\\s]/g,\"\");if(!t)return NaN;\n    if(t.indexOf(\",\")>-1)t=t.replace(/\\./g,\"\").replace(\",\",\".\");\n    else if(/^\\d{1,3}(\\.\\d{3})+$/.test(t))t=t.replace(/\\./g,\"\");\n    var n=Number(t);return isFinite(n)&&n>=0?Math.round(n*100):NaN;\n  }\n  function say(t,k){var m=$(\"msg\");m.textContent=t;m.className=\"msg\"+(t?\" \"+k:\"\")}\n  function flag(id,on){$(id).classList.toggle(\"bad\",on)}\n\n  // chips\n  $(\"chips\").innerHTML=DOCS.map(function(d,i){return '<label><input type=\"checkbox\" value=\"'+esc(d)+'\"> '+esc(d)+'<\/label>'}).join(\"\");\n  function missing(){return document.querySelector('input[name=miss]:checked').value===\"y\"}\n  document.querySelectorAll(\"input[name=miss]\").forEach(function(r){r.addEventListener(\"change\",function(){$(\"missBox\").classList.toggle(\"hide\",!missing());say(\"\")})});\n  [\"op\",\"dt\",\"val\",\"note\"].forEach(function(i){$(i).addEventListener(\"input\",function(){flag(i,false);say(\"\")})});\n\n  function resetForm(){\n    editId=null;$(\"f\").reset();$(\"dt\").value=today();$(\"missBox\").classList.add(\"hide\");\n    $(\"ft\").textContent=\"Novo lançamento\";$(\"save\").textContent=\"Salvar lançamento\";$(\"cancel\").classList.add(\"hide\");\n    [\"op\",\"dt\",\"val\",\"note\"].forEach(function(i){flag(i,false)});\n  }\n\n  $(\"f\").addEventListener(\"submit\",function(e){\n    e.preventDefault();\n    var op=$(\"op\").value.trim(),dt=$(\"dt\").value,cents=parseMoney($(\"val\").value.trim()),miss=missing();\n    var docs=[].slice.call(document.querySelectorAll(\"#chips input:checked\")).map(function(c){return c.value});\n    var note=$(\"note\").value.trim();\n    [\"op\",\"dt\",\"val\",\"note\"].forEach(function(i){flag(i,false)});\n    if(!op){flag(\"op\",true);say(\"Informe o nome do operador.\",\"err\");$(\"op\").focus();return}\n    if(!dt){flag(\"dt\",true);say(\"Informe a data do caixa.\",\"err\");$(\"dt\").focus();return}\n    if(isNaN(cents)){flag(\"val\",true);say(\"Digite o valor do caixa, por exemplo 1.250,90.\",\"err\");$(\"val\").focus();return}\n    if(miss&&!docs.length&&!note){flag(\"note\",true);say(\"Marque os documentos que faltaram ou descreva a falta.\",\"err\");$(\"note\").focus();return}\n    var r={id:editId||String(Date.now())+Math.random().toString(36).slice(2,6),operator:op,date:dt,cents:cents,missing:miss,docs:miss?docs:[],note:miss?note:\"\"};\n    var wasEdit=!!editId;\n    if(wasEdit)recs=recs.map(function(x){return x.id===editId?r:x});else recs.push(r);\n    var ok=persist();resetForm();render();\n    say(ok?(wasEdit?\"Lançamento atualizado.\":\"Lançamento salvo.\"):\"Salvo só nesta tela: o navegador bloqueou o armazenamento.\",ok?\"ok\":\"err\");\n    $(\"op\").focus();\n  });\n  $(\"cancel\").addEventListener(\"click\",function(){resetForm();say(\"\")});\n\n  function edit(id){\n    var r=recs.filter(function(x){return x.id===id})[0];if(!r)return;\n    editId=id;$(\"op\").value=r.operator;$(\"dt\").value=r.date;$(\"val\").value=(r.cents/100).toFixed(2).replace(\".\",\",\");\n    document.querySelector('input[name=miss][value='+(r.missing?\"y\":\"n\")+']').checked=true;\n    $(\"missBox\").classList.toggle(\"hide\",!r.missing);\n    document.querySelectorAll(\"#chips input\").forEach(function(c){c.checked=r.docs.indexOf(c.value)>-1});\n    $(\"note\").value=r.note;$(\"ft\").textContent=\"Editar lançamento\";$(\"save\").textContent=\"Salvar alterações\";$(\"cancel\").classList.remove(\"hide\");\n    say(\"\");$(\"f\").scrollIntoView({behavior:\"smooth\",block:\"start\"});$(\"op\").focus();\n  }\n\n  function filtered(){\n    var q=$(\"q\").value.trim().toLowerCase(),mo=$(\"mo\").value,om=$(\"onlyMiss\").checked;\n    return recs.filter(function(r){\n      return (!q||r.operator.toLowerCase().indexOf(q)>-1)&&(!mo||r.date.slice(0,7)===mo)&&(!om||r.missing);\n    }).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:b.id.localeCompare(a.id)});\n  }\n\n  function render(){\n    var list=filtered(),sum=0,miss=0;\n    list.forEach(function(r){sum+=r.cents;if(r.missing)miss++});\n    $(\"sCount\").textContent=list.length;$(\"sSum\").textContent=brl.format(sum/100);$(\"sMiss\").textContent=miss;\n    $(\"ops\").innerHTML=Array.from(new Set(recs.map(function(r){return r.operator}))).sort().map(function(o){return '<option value=\"'+esc(o)+'\">'}).join(\"\");\n    $(\"rows\").innerHTML=list.map(function(r){\n      var d=r.missing?'<span class=\"tag no\">Faltou<\/span><span class=\"det\">'+esc(r.docs.join(\", \"))+(r.docs.length&&r.note?\" — \":\"\")+esc(r.note)+'<\/span>':'<span class=\"tag ok\">Completo<\/span>';\n      return '<tr><td>'+fdate(r.date)+'<\/td><td>'+esc(r.operator)+'<\/td><td class=\"v\">'+brl.format(r.cents/100)+'<\/td><td>'+d+'<\/td><td><div class=\"rb\"><button data-e=\"'+r.id+'\">Editar<\/button><button class=\"del'+(armed===r.id?\" arm\":\"\")+'\" data-d=\"'+r.id+'\">'+(armed===r.id?\"Confirmar\":\"Excluir\")+'<\/button><\/div><\/td><\/tr>';\n    }).join(\"\");\n    var em=$(\"empty\"),has=list.length>0;\n    em.classList.toggle(\"hide\",has);$(\"rows\").parentNode.classList.toggle(\"hide\",!has);\n    em.textContent=recs.length?\"Nenhum lançamento com esses filtros.\":\"Nenhum lançamento ainda. Preencha o formulário e salve o primeiro fechamento de caixa.\";\n  }\n\n  $(\"rows\").addEventListener(\"click\",function(e){\n    var b=e.target.closest(\"button\");if(!b)return;\n    if(b.dataset.e)return edit(b.dataset.e);\n    var id=b.dataset.d;\n    if(armed===id){recs=recs.filter(function(x){return x.id!==id});armed=null;persist();if(editId===id)resetForm();render();say(\"Lançamento excluído.\",\"ok\")}\n    else{armed=id;render();setTimeout(function(){if(armed===id){armed=null;render()}},4000)}\n  });\n  [\"q\",\"mo\"].forEach(function(i){$(i).addEventListener(\"input\",render)});$(\"onlyMiss\").addEventListener(\"change\",render);\n\n  // CSV\n  $(\"exp\").addEventListener(\"click\",function(){\n    var q=function(s){return '\"'+String(s).replace(/\"/g,'\"\"')+'\"'};\n    var out=[\"Data;Operador;Total do caixa;Faltou documento;Documentos faltantes;Detalhes\"].concat(filtered().map(function(r){\n      return [fdate(r.date),q(r.operator),(r.cents/100).toFixed(2).replace(\".\",\",\"),r.missing?\"Sim\":\"Não\",q(r.docs.join(\", \")),q(r.note)].join(\";\")}));\n    $(\"csv\").value=out.join(\"\\n\");$(\"dlg\").showModal();$(\"csv\").select();\n  });\n  $(\"copy\").addEventListener(\"click\",function(){\n    var t=$(\"csv\"),b=this;t.select();\n    var done=function(){b.textContent=\"Copiado\";setTimeout(function(){b.textContent=\"Copiar\"},1500)};\n    try{navigator.clipboard.writeText(t.value).then(done,function(){document.execCommand(\"copy\");done()})}catch(e){try{document.execCommand(\"copy\");done()}catch(_){}}\n  });\n  $(\"close\").addEventListener(\"click\",function(){$(\"dlg\").close()});\n\n  $(\"out\").addEventListener(\"click\",function(){parent.postMessage({marajo:\"logout\"},\"*\")});\n  load();resetForm();render();\n})();\n<\/script>\n<\/body>\n<\/html>\n";</script>
<script>
(function(){
  // Contas de demonstração. Em produção, troque authenticate() por uma chamada ao seu servidor.
  var USERS=[
    {email:"admin@postomarajo.com.br",pass:"marajo123",name:"Administrador"},
    {email:"caixa@postomarajo.com.br",pass:"caixa123",name:"Caixa"},
    {email:"ernesto.barros",pass:"Marajo80",name:"Ernesto Barros"}
  ];
  var $=function(id){return document.getElementById(id)};
  var tries=0,lockUntil=0,timer=null;
  function store(k,v){try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
  function read(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function sess(k,v){try{if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){}}
  function sread(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
  var validEmail=function(v){return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)};
  function show(id){["vLogin","vForgot"].forEach(function(v){$(v).classList.toggle("hide",v!==id)})}
  function say(el,t,k){el.textContent=t;el.className="msg"+(t&&k?" "+k:"")}
  function bad(id,on){$(id).classList.toggle("bad",on)}

  // Authenticate: simula uma chamada ao servidor
  function authenticate(email,pass){
    return new Promise(function(res){setTimeout(function(){
      var u=USERS.filter(function(x){return x.email===email.toLowerCase()&&x.pass===pass})[0];
      res(u||null)},700)});
  }

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function welcome(u){
    $("app").srcdoc=APP_HTML.split("__USER__").join(esc(u.name));
    document.body.classList.add("in");
  }
  window.addEventListener("message",function(e){
    if(e.source===$("app").contentWindow&&e.data&&e.data.marajo==="logout"){
      sess("marajo_user",null);document.body.classList.remove("in");$("app").srcdoc="";show("vLogin");$("email").focus();
    }
  });

  function lock(){
    var s=Math.ceil((lockUntil-Date.now())/1000);
    if(s<=0){clearInterval(timer);$("go").disabled=false;say($("msg"),"");tries=0;return}
    $("go").disabled=true;say($("msg"),"Muitas tentativas. Tente de novo em "+s+" s.","err");
  }

  $("eye").addEventListener("click",function(){
    var p=$("pass"),show=p.type==="password";
    p.type=show?"text":"password";
    this.setAttribute("aria-pressed",show);this.setAttribute("aria-label",show?"Ocultar senha":"Mostrar senha");
  });
  ["email","pass","femail"].forEach(function(id){$(id).addEventListener("input",function(){
    bad("fEmail",false);bad("fPass",false);bad("fFEmail",false);if(Date.now()>lockUntil)say($("msg"),"");say($("fmsg"),"");
  })});

  $("fLogin").addEventListener("submit",function(e){
    e.preventDefault();
    if(Date.now()<lockUntil)return;
    var email=$("email").value.trim(),pass=$("pass").value,m=$("msg");
    bad("fEmail",false);bad("fPass",false);
    if(!email){bad("fEmail",true);say(m,"Digite seu usuário ou e-mail.","err");$("email").focus();return}
    if(!pass){bad("fPass",true);say(m,"Digite sua senha.","err");$("pass").focus();return}
    var btn=$("go");btn.disabled=true;btn.innerHTML='<span class="spin"></span>Entrando';say(m,"");
    authenticate(email,pass).then(function(u){
      btn.innerHTML="Entrar";btn.disabled=false;
      if(!u){
        tries++;bad("fEmail",true);bad("fPass",true);$("pass").value="";$("pass").focus();
        if(tries>=5){lockUntil=Date.now()+30000;lock();timer=setInterval(lock,1000)}
        else say(m,"E-mail ou senha incorretos. Restam "+(5-tries)+" tentativas.","err");
        return;
      }
      tries=0;
      if($("remember").checked)store("marajo_email",email);else store("marajo_email",null);
      sess("marajo_user",JSON.stringify({email:u.email,name:u.name}));
      $("pass").value="";welcome(u);
    });
  });

  $("toForgot").addEventListener("click",function(){$("femail").value=$("email").value;say($("fmsg"),"");show("vForgot");$("femail").focus()});
  $("toLogin").addEventListener("click",function(){show("vLogin");$("email").focus()});
  $("fForgot").addEventListener("submit",function(e){
    e.preventDefault();var v=$("femail").value.trim(),m=$("fmsg");
    if(!v){bad("fFEmail",true);say(m,"Digite seu usuário ou e-mail.","err");return}
    // Resposta igual para qualquer e-mail, para não revelar quais contas existem.
    say(m,"Se "+v+" tiver cadastro, as instruções chegam em alguns minutos.","ok");
  });

  // Restaura e-mail lembrado e sessão ativa
  var saved=read("marajo_email");
  if(saved){$("email").value=saved;$("remember").checked=true}
  try{var s=JSON.parse(sread("marajo_user")||"null");if(s)welcome(s)}catch(e){}
})();
</script>
